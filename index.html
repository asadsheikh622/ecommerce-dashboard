<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Admin Dashboard</title>
    <meta name="description" content="Modern premium e-commerce admin dashboard with multi-currency PKR/USD support, profit & loss management, catalogue, orders, and store analytics." />
    <meta property="og:title" content="E-Commerce Admin Dashboard" />
    <meta property="og:description" content="Modern premium e-commerce admin dashboard with multi-currency PKR/USD support, profit & loss management, catalogue, orders, and store analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;

          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return activeFetch || originalFetch;
              },
              set: function (newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              var proto = Object.getPrototypeOf(window);
              if (proto) {
                Object.defineProperty(proto, 'fetch', {
                  get: function () {
                    return activeFetch || originalFetch;
                  },
                  set: function (newFetch) {
                    activeFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }

          window.addEventListener(
            'error',
            function (event) {
              if (
                event &&
                event.message &&
                event.message.indexOf('fetch') !== -1 &&
                event.message.indexOf('getter') !== -1
              ) {
                if (event.preventDefault) event.preventDefault();
                if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                return true;
              }
            },
            true
          );
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
